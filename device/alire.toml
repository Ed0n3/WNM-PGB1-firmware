name = "wnm_pgb1_device"
description = "Firmware for the PGB-1 groovebox"
version = "0.1.0-cfw.5"

authors = ["Fabien Chouteau"]
maintainers = ["Fabien Chouteau <fabien.chouteau@gmail.com>"]
maintainers-logins = ["Fabien-Chouteau"]

executables = ["wnm_pgb1_device"]

[[depends-on]]
tresses = "~2.0.0"
littlefs = "~1.0.0"
flux = "~1.0.0"
noise_nugget_sdk = "~2.0.0"
midi = "~1.0.0"

[build-switches]
"*".ada_version = "ada2022"
release.runtime_checks = "none"

[[pins]]
tresses = {url="https://github.com/wee-noise-makers/tresses", commit="42149a2496b5361abd0605b81db33a305e97f307"}
noise_nugget_sdk = {url="https://github.com/wee-noise-makers/noise-nugget-ada-sdk", commit="717b0e81c1f5016a74ec664d8976b749a07312ad"}
# tresses = { path = "../../tresses"}
# noise_nugget_sdk = { path = "../../noise-nugget-ada-sdk"}

[configuration.values]
noise_nugget_sdk.System_Clock = "SYS_133MHz"
littlefs.Assert = false
littlefs.Debug = false
littlefs.Warn = false
littlefs.Error = false
littlefs.Trace = false
littlefs.No_Malloc = true
tresses.Sample_Rate = "SR32000"
# tresses.Resources_Linker_Section = ".time_critical.tresses_resources"
# tresses.Code_Linker_Section = ".time_critical.tresses_code"
flux.Enable_File_IO = false

[build-profiles]
# noise_nugget_sdk = "development"
# rp2040_hal = "development"
# littlefs = "development"
